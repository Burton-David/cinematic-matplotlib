[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cinestyle"
version = "0.2.0"
description = "Cinematic matplotlib styles inspired by iconic films, plus a reusable-brand API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Burton", email = "david@databurton.com" }]
keywords = ["matplotlib", "visualization", "styling", "theme", "cinematic", "branding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.23",
    "coloraide>=4.0",
]

[project.optional-dependencies]
a11y = ["daltonlens>=0.1.5"]
luts = ["colour-science>=0.4.4"]
plotly = ["plotly>=5.0", "kaleido>=0.2"]
altair = ["altair>=5.5", "vl-convert-python>=1.0"]
dev = [
    "black==24.10.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pytest>=8.0",
    "pytest-mpl>=0.17",
    "daltonlens>=0.1.5",
    "colour-science>=0.4.4",
    "glasbey>=0.2",
    "colorspacious>=1.1",
    "plotly>=5.0",
    "kaleido>=0.2",
    "altair>=5.5",
    "vl-convert-python>=1.0",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/Burton-David/cinematic-matplotlib"
Repository = "https://github.com/Burton-David/cinematic-matplotlib"
Author = "https://databurton.com"

[tool.setuptools.packages.find]
include = ["cinestyle*"]

[tool.setuptools.package-data]
cinestyle = [
    "py.typed",
    "data/fonts/*.ttf",
    "data/fonts/licenses/*",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "mpl_toolkits.*",
    "coloraide.*",
    "cycler.*",
    "daltonlens.*",
    "glasbey.*",
    "colorspacious.*",
    "plotly.*",
    "altair.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# colour-science ships source that newer CPython parsers reject; don't follow it.
module = ["colour.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
